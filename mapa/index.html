<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Mapa Leonida</title>
<style>
:root{--bg:#0b1620;--sea:#0e2a3d;--panel:#101f2c;--ink:#e8f1f7;--mute:#8fa6b6;--acc:#ff4fa3;--line:#1d3446}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#map{position:fixed;inset:0;touch-action:none;background:var(--sea);cursor:grab}
svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:linear-gradient(#0b1620ee,#0b162000);z-index:5;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#102233e6;color:var(--ink);padding:8px 13px;border-radius:99px;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fab{position:fixed;right:12px;z-index:6;display:flex;flex-direction:column;gap:8px;bottom:calc(env(safe-area-inset-bottom) + 14px)}
.btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#102233ee;color:var(--ink);font-size:22px;display:grid;place-items:center;backdrop-filter:blur(6px)}
.btn:active{background:var(--acc)}
.search{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:6;display:flex;gap:8px;width:calc(100% - 80px)}
.search input{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--line);background:#102233ee;color:var(--ink);padding:0 14px;font-size:16px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);transition:transform .22s;max-height:80%;overflow:auto}
.sheet.open{transform:none}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sub{font-size:12px;color:var(--mute);margin-bottom:6px}
.sheet label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:#0b1620;color:var(--ink);padding:11px;font-size:16px}
.sheet p{font-size:13px;color:var(--mute);margin:6px 0}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#16293a;color:var(--ink);font-size:15px;font-weight:600}
.row .pri{background:var(--acc);border-color:var(--acc)}
.row .dan{color:#ff8a8a}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:10px;font-size:13px;z-index:20;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.zone-label{font-weight:800;letter-spacing:.12em;text-transform:uppercase;fill:#fff;paint-order:stroke;stroke:#000a;stroke-linejoin:round;pointer-events:none}
.mk{cursor:pointer}
.mk text{font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none}
.mk .nm{font-weight:600;text-anchor:start;paint-order:stroke;stroke:#000c;stroke-linejoin:round}
</style>
</head>
<body>
<div id="map"><svg id="svg"></svg></div>
<div class="top"><div class="chips" id="chips"></div></div>
<div class="search">
  <input id="q" type="search" placeholder="Buscar (ej. N1N, aeropuerto)…" autocomplete="off">
  <button class="btn" id="btnMenu" aria-label="Menú">⋯</button>
</div>
<div class="fab">
  <button class="btn" id="zin" aria-label="Acercar">＋</button>
  <button class="btn" id="zout" aria-label="Alejar">−</button>
  <button class="btn" id="home" aria-label="Ver todo">⌂</button>
</div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
'use strict';
/* ===== Sistema de coordenadas =====
   Los datos usan metros aproximados (x este+, y norte+) con el sistema de la comunidad de mapeo
   (centro 0,0). Se normalizan a 0..1 para que los marcadores sigan al mapa aunque cargues tu imagen. */
const BX=[-8500,4000], BY=[-7800,8500];
const nu=x=>(x-BX[0])/(BX[1]-BX[0]), nv=y=>(BY[1]-y)/(BY[1]-BY[0]);
const W=1000; const H0=Math.round(W*(BY[1]-BY[0])/(BX[1]-BX[0]));
let H=H0, hasImg=false;

/* Geografía esquemática ORIGINAL (no es el arte de Rockstar). Polígonos en metros. */
const LANDm=[[-8200,7500],[-2000,8300],[2800,8000],[3200,5500],[3000,3500],[2400,2800],[2300,800],[2000,-400],[1500,-1800],[800,-3000],[-500,-4500],[-1500,-4600],[-3500,-4200],[-5000,-3000],[-6500,-2600],[-8200,-2000],[-8400,500],[-8000,2500],[-8300,5000]];
const KEYSm=[[600,-4900,520,230,-25],[-300,-5350,430,200,-30],[-1250,-5450,520,210,-20],[-2300,-6000,420,190,-30],[-3300,-6600,430,200,-35],[-4000,-7100,380,170,-30],[-1900,-5750,300,120,-25]];
const LAKEm=[-3200,3400,1500,1000];
const ZONES=[
 {id:'kalaga',n:'Mount Kalaga',c:'#4f7a4a',p:[[-8200,7500],[-2000,8300],[2800,8000],[3200,5500],[-1000,5300],[-5500,5500],[-8300,5000]]},
 {id:'ambrosia',n:'Ambrosia',c:'#b58a3c',p:[[-8300,5000],[-5500,5500],[-1000,5300],[500,3800],[-1800,2200],[-5000,1600],[-6000,3000],[-8400,2800]]},
 {id:'vice',n:'Vice City',c:'#d6458f',p:[[-1800,2200],[500,3800],[3000,3500],[2400,2800],[2300,800],[2000,-400],[-800,-300],[-2000,900]]},
 {id:'port',n:'Port Gellhorn',c:'#7a6fb5',p:[[-8400,2800],[-6000,3000],[-5000,1600],[-5400,-2200],[-8200,-2000],[-8400,500]]},
 {id:'grass',n:'Grassrivers',c:'#3f8f7a',p:[[-5000,1600],[-1800,2200],[-2000,900],[-800,-300],[2000,-400],[1500,-1800],[800,-3000],[-1000,-3400],[-3500,-3200],[-5400,-2200]]},
 {id:'keys',n:'Leonida Keys',c:'#2fb4c9',p:[[1500,-3500],[1200,-5200],[-1500,-6500],[-4500,-7500],[-5000,-6500],[-3500,-4300],[-5000,-3000],[-3500,-3200],[-1000,-3400],[800,-3000]]}
];
const CATS={
 T:{n:'Zonas y pueblos',c:'#ff4fa3'}, S:{n:'Safehouses',c:'#f0b429'}, H:{n:'Hoteles',c:'#e879f9'},
 A:{n:'Aeropuertos',c:'#60a5fa'}, M:{n:'Puertos y marinas',c:'#22d3ee'}, R:{n:'Transporte',c:'#a3e635'},
 F:{n:'Comida y bares',c:'#fb923c'}, B:{n:'Tiendas',c:'#38bdf8'}, G:{n:'Gobierno y policía',c:'#94a3b8'},
 L:{n:'Monumentos',c:'#f472b6'}, D:{n:'Deportes y ocio',c:'#4ade80'}, N:{n:'Naturaleza',c:'#34d399'},
 P:{n:'Puentes y carreteras',c:'#facc15'}, I:{n:'Industria',c:'#a78bfa'}, U:{n:'Mis marcadores',c:'#ff4fa3'}
};
/* [nombre, categoría, x, y, importancia 1-3, confianza 'a' referencia comunidad / 'e' estimada, zona, texto corto, nota] */
const D=[

 ['Aeropuerto Internacional de Vice City','A',-1500,800,1,'e','vice','VCI','Aeropuerto principal, con estación de metro y tren.'],
 ['NINE1NINE (N1N)','F',-300,1550,1,'e','vice','N1N','Club nocturno en Downtown, Vice City.'],
 ['The Vault','F',-200,1500,3,'e','vice','VT','Club en Downtown.'],
 ['Effluvia','F',1900,700,3,'e','vice','EF','Ocean Beach.'],
 ['Conch King','F',-700,1900,3,'e','vice','CKg','La Perle.'],

 ['Lucia\'s Apartment','S',-1000,1700,2,'e','vice','LA','Crosstown, Vice City.'],
 ['Vice Regal Hotel','H',1409,2803,2,'a','vice','VR','Torre de lujo frente al mar al norte de Vice Beach.'],
 ['Akio Hotel','H',-250,1750,3,'e','vice','AK','Tequesta Retreat.'],

 ['Vice City Sign','L',-1450,900,3,'e','vice','VS',''],
 ['San Leandro Lighthouse','L',1700,-450,3,'e','vice','SL','Faro en Catalan Key.'],
 ['Estación Metro Downtown','R',-200,1400,3,'e','vice','M',''],

 ['Rivo Bridge','P',900,2150,3,'e','vice','RB',''],
 ['Vice Beach Police Dept.','G',1900,950,3,'e','vice','PD','Ocean Beach.'],
 ['Catalan Bay','N',1100,300,3,'e','vice','CB',''],
 ['Waning Sands','T',-800,-500,2,'e','vice','WS',''],
 ['Evergreen Mall','B',-950,-250,2,'e','vice','EM','Centro comercial en Waning Sands.'],
 ['Leaf Links Golf Club','D',200,-900,3,'e','vice','GC','Condado de Vice-Dale.'],
 ['Vice-Dale County','T',700,-700,2,'e','vice','VD','Condado al sureste.'],
 ['Hamlet','T',-700,-1500,2,'e','grass','HA',''],
 ['Prisión de Hamlet','G',-1100,-1900,3,'e','grass','PR',''],
 ['Peregrine Bay','T',800,-1100,3,'e','grass','PB',''],
 ['Fuzzard Power Station','I',900,-1300,3,'e','grass','PS','Central eléctrica.'],
 ['Grassrivers','T',-3200,-1500,1,'e','grass','GR','Humedales tipo Everglades.'],
 ['Pelican Valley','T',-4200,-500,3,'e','grass','PV',''],
 ['Canales de aerodeslizador','N',-2800,-2000,3,'e','grass','AB','Canales, pantanos y campamentos sobre pilotes.'],
 ['Mariana County','T',-2500,-3300,2,'e','grass','MC','Condado al sur.'],
 ['Goliath','I',-2600,-3000,3,'e','grass','GO',''],
 ['Leonida Keys','T',-900,-5600,1,'a','keys','LK','Archipiélago conectado por puentes.'],
 ['Key Lento','T',-1200,-5300,2,'e','keys','KL',''],
 ['Watson Bay','T',-300,-4300,2,'e','keys','WB',''],
 ['Aeropuerto de Watson Bay','A',-250,-4450,3,'e','keys','WA',''],
 ['Maroon Key','T',-2300,-6000,3,'e','keys','MK','Zona del dirigible.'],
 ['Abismo Key','T',-3300,-6600,3,'e','keys','AK',''],
 ['Goose Key','T',-4000,-7100,3,'e','keys','GK','Arrecifes.'],
 ['Jason\'s House','S',-1250,-5350,2,'e','keys','JH','Safehouse en Key Lento.'],
 ['The Rusty Anchor','F',-1100,-5500,3,'e','keys','RA','Bar en Key Lento.'],
 ['Brian\'s Boat Works & Marina','M',-1300,-5200,3,'e','keys','BM',''],
 ['Overseas Highway','P',-1800,-5800,3,'e','keys','OH','Autopista con puentes sobre el mar.'],
 ['Port Gellhorn','T',-6200,-900,1,'a','port','PG','Ciudad portuaria de la costa del golfo.'],
 ['Estación de tren de Port Gellhorn','R',-6100,-700,3,'e','port','TR',''],
 ['Bocamar Bridge','P',-6700,300,2,'e','port','BB',''],
 ['Bocamar Bay','N',-7200,100,3,'e','port','BY',''],
 ['Gellhorn International Raceway','D',-5700,-1600,2,'e','port','GR','Circuito.'],
 ['Lucky Plucker','F',-6300,-1000,3,'e','port','LP',''],
 ['Ambrosia','T',-2400,1900,1,'e','ambrosia','AM','Zona agrícola e industrial junto al lago.'],
 ['Ambrosia Mill','I',-2500,2000,3,'e','ambrosia','AM','Ingenio de azúcar.'],
 ['Policía de Ambrosia','G',-2300,1800,3,'e','ambrosia','PD',''],
 ['Lake Leonida','N',-3200,3400,1,'e','ambrosia','LL','Gran lago interior.'],
 ['Belville','T',-4200,2600,3,'e','ambrosia','BV',''],
 ['Bluegrass','T',-4700,2000,3,'e','ambrosia','BG',''],
 ['Buckskin','T',-1500,3600,3,'e','ambrosia','BK',''],
 ['Millport','T',-5200,3000,3,'e','ambrosia','MP',''],
 ['Emerald Springs','N',-1800,4400,3,'e','ambrosia','ES',''],
 ['Kelly County','T',-7000,4500,2,'e','ambrosia','KC','Condado al oeste.'],
 ['Starlet Motel','S',-7100,4700,2,'e','ambrosia','SM','Safehouse en la Ruta Histórica 628.'],
 ['Cañón de Kelly','N',-6800,5800,3,'e','kalaga','CN',''],
 ['Mount Kalaga','N',-3000,7000,1,'e','kalaga','MK','Parque nacional, bosques y cañones.'],
 ['Lummox County','T',-1000,6500,2,'e','kalaga','LU','Condado al norte.'],
 ['Leonard County','T',1500,5000,2,'e','kalaga','LE','Condado al noreste.'],
 ['Breakwater Quarry','I',-1500,7300,3,'e','kalaga','BQ','Cantera, norte de Leonida.'],
 ['Océano Atlántico','N',3400,0,3,'e','vice','OA',''],
 ['Golfo de Leonida','N',-7800,-4800,3,'e','port','GL','']
];
const SEED=D.map((d,i)=>({id:'s'+i,name:d[0],cat:d[1],u:nu(d[2]),v:nv(d[3]),imp:d[4],conf:d[5],z:d[6],t:d[7],note:d[8]}));

/* ===== Estado (se guardan solo tus cambios) ===== */
const $=s=>document.querySelector(s);
const svg=$('#svg'), mapEl=$('#map'), NS='http://www.w3.org/2000/svg';
const mk=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st=store.get('st2',null)||{user:[],ov:{}};
const save=()=>store.set('st2',st);
let markers=[];
function build(){markers=[];
  for(const s of SEED){const o=st.ov[s.id]||{};if(o.del)continue;markers.push({...s,...o})}
  for(const u of st.user)markers.push({...u,cat:u.cat||'U',imp:1,conf:'u'});}
build();
let view={x:0,y:0,s:1}, fit=1, vw=0, vh=0, filter='all', cats=new Set(Object.keys(CATS));

/* ===== Escena ===== */
const world=mk('g',{},svg), bg=mk('g',{},world);
const imgLayer=mk('image',{x:0,y:0,width:W,height:H,preserveAspectRatio:'none'},world);
const defs=mk('defs',{},svg);
const px=(x,y)=>[nu(x)*W,nv(y)*H0];
const pts=a=>a.map(p=>px(p[0],p[1]).join(',')).join(' ');
const pat=mk('pattern',{id:'grid',width:50,height:50,patternUnits:'userSpaceOnUse'},defs);
mk('path',{d:'M50 0H0V50',fill:'none',stroke:'#ffffff10','stroke-width':1},pat);
mk('rect',{x:-3000,y:-3000,width:7000,height:7000,fill:'#0e2a3d'},bg);
mk('rect',{x:-3000,y:-3000,width:7000,height:7000,fill:'url(#grid)'},bg);
const landG=mk('g',{},bg);
const mpu=(BX[1]-BX[0])/W;  /* metros por unidad de mundo */
const isl=k=>{const [x,y]=px(k[0],k[1]);return {cx:x,cy:y,rx:k[2]/mpu,ry:k[3]/mpu,transform:`rotate(${-k[4]} ${x} ${y})`}};
mk('polygon',{points:pts(LANDm),fill:'#26443a',stroke:'#7fb5a0','stroke-width':3,'stroke-linejoin':'round'},landG);
KEYSm.forEach(k=>mk('ellipse',{...isl(k),fill:'#26443a',stroke:'#7fb5a0','stroke-width':3},landG));
const lk=px(LAKEm[0],LAKEm[1]);
mk('ellipse',{cx:lk[0],cy:lk[1],rx:LAKEm[2]/mpu,ry:LAKEm[3]/mpu,fill:'#0e2a3d',stroke:'#7fb5a0','stroke-width':2},landG);
const clip=mk('clipPath',{id:'landclip'},defs);
mk('polygon',{points:pts(LANDm)},clip);KEYSm.forEach(k=>mk('ellipse',isl(k),clip));
const zoneG=mk('g',{'clip-path':'url(#landclip)'},world);
const zoneEls={},zoneLbl={};
const lblG=mk('g',{},svg), mkG=mk('g',{},svg);
ZONES.forEach(z=>{
  zoneEls[z.id]=mk('polygon',{points:pts(z.p),fill:z.c,'fill-opacity':.33,stroke:z.c,'stroke-width':2.5,'stroke-linejoin':'round'},zoneG);
  const w=z.p.map(p=>px(p[0],p[1]));z.cx=w.reduce((a,b)=>a+b[0],0)/w.length;z.cy=w.reduce((a,b)=>a+b[1],0)/w.length;
  z.bb=[Math.min(...w.map(p=>p[0])),Math.min(...w.map(p=>p[1])),Math.max(...w.map(p=>p[0])),Math.max(...w.map(p=>p[1]))];
  zoneLbl[z.id]=mk('text',{class:'zone-label','text-anchor':'middle'},lblG);zoneLbl[z.id].textContent=z.n;
});
const wx=m=>m.u*W, wy=m=>m.v*H;

/* ===== Vista ===== */
function resize(){vw=mapEl.clientWidth;vh=mapEl.clientHeight;fit=Math.min(vw/W,vh/H)*0.96}
function clampView(){view.s=Math.max(fit*.8,Math.min(fit*24,view.s));const m=60*view.s;
  view.x=Math.min(m,Math.max(vw-W*view.s-m,view.x));view.y=Math.min(m,Math.max(vh-H*view.s-m,view.y))}
let raf=0;
function render(){raf=0;clampView();
  world.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.s})`);
  const rel=view.s/fit;
  /* el redondito se achica al acercar, como en el juego */
  const d=Math.max(18,Math.min(44,46/Math.pow(rel,0.62)));
  mkG.replaceChildren();
  const q=($('#q').value||'').trim().toLowerCase();
  const maxImp=rel>4?3:rel>1.8?2:1;
  for(const m of markers){
    if(!cats.has(m.cat))continue;
    const hit=q&&(m.name.toLowerCase().includes(q)||(m.t||'').toLowerCase().includes(q)||(CATS[m.cat]||{n:''}).n.toLowerCase().includes(q));
    if(!hit&&m.imp>maxImp)continue;
    if(filter!=='all'&&m.z!==filter&&!hit)continue;
    const sx=view.x+wx(m)*view.s, sy=view.y+wy(m)*view.s;
    if(sx<-60||sy<-60||sx>vw+60||sy>vh+60)continue;
    const g=mk('g',{class:'mk',transform:`translate(${sx} ${sy})`,opacity:m.found?.55:1},mkG);g.dataset.id=m.id;
    mk('circle',{r:d/2+(hit?5:0),fill:(CATS[m.cat]||CATS.U).c,stroke:'#fff','stroke-width':Math.max(1.5,d*0.07)+(hit?2:0),'stroke-dasharray':m.conf==='e'?'4 3':''},g);
    const tx=m.found?'✓':(m.t||m.name.slice(0,3)).toUpperCase();
    if(d>=17){const t=mk('text',{y:d*0.12,'font-size':Math.min(d*0.36,d*1.5/Math.max(tx.length,2.2))},g);t.textContent=tx}
    if(rel>2.2||hit){const n=mk('text',{class:'nm',x:d/2+5,y:4,'font-size':12},g);n.textContent=m.name}
  }
  const zo=rel>6?0:rel>3?.5:1;
  ZONES.forEach(z=>{const t=zoneLbl[z.id];const vis=!hasImg&&(filter==='all'||filter===z.id)&&zo>0;
    t.style.display=vis?'':'none';t.setAttribute('x',view.x+z.cx*view.s);t.setAttribute('y',view.y+z.cy*view.s);
    t.setAttribute('font-size',Math.max(11,Math.min(22,13+rel*2)));t.setAttribute('opacity',zo);t.setAttribute('stroke-width',3);
    zoneEls[z.id].setAttribute('fill-opacity',filter==='all'?.33:(filter===z.id?.28:.08))});
}
const redraw=()=>{raf||(raf=requestAnimationFrame(render))};
function zoomAt(px_,py_,f){const ns=Math.max(fit*.8,Math.min(fit*24,view.s*f));f=ns/view.s;view.x=px_-(px_-view.x)*f;view.y=py_-(py_-view.y)*f;view.s=ns;redraw()}
function flyTo(bb,pad=0.12){const bw=bb[2]-bb[0],bh=bb[3]-bb[1];const s=Math.min(vw/(bw*(1+pad*2)),vh/(bh*(1+pad*2)));anim({x:vw/2-((bb[0]+bb[2])/2)*s,y:vh/2-((bb[1]+bb[3])/2)*s,s})}
function anim(t){const a={...view},t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/380),e=1-Math.pow(1-p,3);
  view.s=a.s+(t.s-a.s)*e;view.x=a.x+(t.x-a.x)*e;view.y=a.y+(t.y-a.y)*e;render();if(p<1)requestAnimationFrame(f)})(t0)}
const home=()=>flyTo([0,0,W,H],0);

/* ===== Gestos ===== */
const ptrs=new Map();let last=null,lp=null,moved=false,lpT=0,lastTap=0,moving=null;
const pinfo=()=>{const a=[...ptrs.values()];return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2}};
mapEl.addEventListener('pointerdown',e=>{mapEl.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(ptrs.size===1){last={x:e.clientX,y:e.clientY};clearTimeout(lpT);
    if(!(e.target.closest&&e.target.closest('.mk')))lpT=setTimeout(()=>{if(!moved&&ptrs.size===1){navigator.vibrate&&navigator.vibrate(20);newMarker(e.clientX,e.clientY)}},650)}
  else{clearTimeout(lpT);lp=pinfo()}});
mapEl.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&last){const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(moved)clearTimeout(lpT);
    view.x+=dx;view.y+=dy;last={x:e.clientX,y:e.clientY};redraw()}
  else if(ptrs.size===2&&lp){moved=true;const n=pinfo();view.x+=n.cx-lp.cx;view.y+=n.cy-lp.cy;zoomAt(n.cx,n.cy,n.d/lp.d);lp=n}});
const up=e=>{clearTimeout(lpT);const wasTap=!moved&&ptrs.size===1;ptrs.delete(e.pointerId);
  if(ptrs.size===1){last={...[...ptrs.values()][0]};lp=null}else last=null;
  if(wasTap){const mg=e.target.closest&&e.target.closest('.mk');
    if(moving){placeMoving(e.clientX,e.clientY)}
    else if(mg)openMarker(mg.dataset.id);
    else{const now=Date.now();if(now-lastTap<300)zoomAt(e.clientX,e.clientY,2.2);lastTap=now;closeSheet()}}};
mapEl.addEventListener('pointerup',up);mapEl.addEventListener('pointercancel',up);
mapEl.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0018))},{passive:false});

/* ===== UI ===== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(){const c=$('#chips');c.replaceChildren();
  const add=(id,n)=>{const b=document.createElement('button');b.className='chip'+(filter===id?' on':'');b.textContent=n;
    b.onclick=()=>{filter=id;chips();id==='all'?home():flyTo(ZONES.find(z=>z.id===id).bb);redraw()};c.appendChild(b)};
  add('all','Todo');ZONES.forEach(z=>add(z.id,z.n));
  const u=document.createElement('button');u.className='chip';u.textContent='Cargar mi mapa';u.onclick=()=>$('#file').click();c.appendChild(u)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
const sheet=$('#sheet');
const closeSheet=()=>sheet.classList.remove('open');
function zoneAt(x,y){let b=null,bd=1e9;for(const z of ZONES){const d=(z.cx-x)**2+(z.cy-y)**2;if(d<bd){bd=d;b=z.id}}return b}
function persist(m,patch){Object.assign(m,patch);
  if(m.id.startsWith('s')){st.ov[m.id]={...(st.ov[m.id]||{}),...patch}}
  else{const i=st.user.findIndex(k=>k.id===m.id);if(i>=0)st.user[i]={...st.user[i],...patch}}
  save()}
function openMarker(id){const m=markers.find(k=>k.id===id);if(!m)return;
  const isSeed=m.id.startsWith('s');
  const conf=m.conf==='a'?'Posición de referencia de la comunidad (aprox.)':m.conf==='e'?'Posición estimada: ajústala con Mover si hace falta':'Marcador tuyo';
  sheet.innerHTML=`<h3>${esc(m.name)}</h3><div class="sub">${(CATS[m.cat]||CATS.U).n} · ${conf}</div>
  ${m.note?`<p>${esc(m.note)}</p>`:''}
  <div class="row"><button class="pri" id="b_f">${m.found?'Quitar encontrado':'Marcar encontrado'}</button><button id="b_mv">Mover</button></div>
  ${isSeed?'':`<label>Nombre</label><input id="f_n" value="${esc(m.name)}"><label>Notas</label><textarea id="f_o" rows="2">${esc(m.note||'')}</textarea>`}
  <div class="row">${isSeed?'':'<button id="b_ok">Guardar</button>'}<button class="dan" id="b_del">Borrar</button><button id="b_c">Cerrar</button></div>`;
  sheet.classList.add('open');
  $('#b_f').onclick=()=>{persist(m,{found:!m.found});closeSheet();redraw()};
  $('#b_mv').onclick=()=>{closeSheet();moving=m;toast('Toca el mapa para colocarlo')};
  $('#b_c').onclick=closeSheet;
  $('#b_del').onclick=()=>{if(isSeed){st.ov[m.id]={...(st.ov[m.id]||{}),del:true}}else st.user=st.user.filter(k=>k.id!==m.id);save();build();closeSheet();redraw()};
  if(!isSeed)$('#b_ok').onclick=()=>{persist(m,{name:$('#f_n').value.trim()||'Sin nombre',note:$('#f_o').value});closeSheet();redraw()}}
function placeMoving(cx,cy){const r=mapEl.getBoundingClientRect();
  const x=(cx-r.left-view.x)/view.s,y=(cy-r.top-view.y)/view.s;persist(moving,{u:x/W,v:y/H,z:zoneAt(x,y*H0/H)});moving=null;redraw();toast('Movido')}
function newMarker(cx,cy){const r=mapEl.getBoundingClientRect();const x=(cx-r.left-view.x)/view.s,y=(cy-r.top-view.y)/view.s;
  sheet.innerHTML=`<h3>Nuevo marcador</h3><label>Nombre</label><input id="f_n"><label>Texto del redondito (máx. 4)</label><input id="f_t" maxlength="4">
  <label>Categoría</label><select id="f_c">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k==='U'?'selected':''}>${v.n}</option>`).join('')}</select>
  <label>Notas</label><textarea id="f_o" rows="2"></textarea><div class="row"><button class="pri" id="b_ok">Guardar</button><button id="b_x">Cancelar</button></div>`;
  sheet.classList.add('open');$('#b_x').onclick=closeSheet;
  $('#b_ok').onclick=()=>{const n=$('#f_n').value.trim()||'Sin nombre';st.user.push({id:'u'+Date.now(),name:n,t:($('#f_t').value.trim()||n.slice(0,3)).toUpperCase(),cat:$('#f_c').value,u:x/W,v:y/H,z:zoneAt(x,y*H0/H),note:$('#f_o').value});save();build();closeSheet();redraw()}}

$('#zin').onclick=()=>zoomAt(vw/2,vh/2,1.8);
$('#zout').onclick=()=>zoomAt(vw/2,vh/2,1/1.8);
$('#home').onclick=()=>{filter='all';chips();home();redraw()};
$('#q').addEventListener('input',()=>{const q=$('#q').value.trim().toLowerCase();redraw();if(!q)return;
  const m=markers.find(k=>k.name.toLowerCase().includes(q)||(k.t||'').toLowerCase()===q);
  if(m){const s=fit*8;anim({s,x:vw/2-wx(m)*s,y:vh/2-wy(m)*s})}});
function menu(){const found=markers.filter(m=>m.found).length;
  sheet.innerHTML=`<h3>Opciones</h3><div class="sub">Encontrados: ${found} de ${markers.length}</div>
  <label>Categorías visibles</label>
  <div class="cats">${Object.entries(CATS).map(([k,v])=>`<button class="chip ${cats.has(k)?'on':''}" data-k="${k}" style="${cats.has(k)?'background:'+v.c+';border-color:'+v.c:''}">${v.n}</button>`).join('')}</div>
  <label>Mapa propio (opcional): captura o imagen del mapa que tengas</label>
  <div class="row" style="margin-top:4px"><button id="m_img">Cargar imagen</button><button id="m_rm">Quitar</button></div>
  <div class="row"><button id="m_exp">Exportar</button><button id="m_rst" class="dan">Restablecer todo</button></div>
  <p>Círculo con borde discontinuo = posición estimada. Mantén pulsado en el mapa para crear un marcador. Lugares y coordenadas de referencia: comunidad gtadb.org (CC BY 4.0), reconstrucción no oficial; el dibujo del mapa es esquemático y original.</p>
  <div class="row"><button id="m_cl">Cerrar</button></div>`;
  sheet.classList.add('open');
  sheet.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;cats.has(k)?cats.delete(k):cats.add(k);menu();redraw()});
  $('#m_img').onclick=()=>$('#file').click();
  $('#m_rm').onclick=()=>{setImage(null);idbSet(null);toast('Imagen quitada')};
  $('#m_exp').onclick=()=>{const b=new Blob([JSON.stringify(st,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mapa-leonida.json';a.click()};
  $('#m_rst').onclick=()=>{if(confirm('¿Borrar tus marcadores y cambios?')){st={user:[],ov:{}};save();build();closeSheet();redraw()}};
  $('#m_cl').onclick=closeSheet}
$('#btnMenu').onclick=menu;

function setImage(src){
  if(!src){imgLayer.removeAttribute('href');hasImg=false;H=H0;imgLayer.setAttribute('height',H);bg.style.display='';zoneG.style.display='';resize();home();redraw();return}
  const im=new Image();im.onload=()=>{H=Math.round(W*im.naturalHeight/im.naturalWidth);imgLayer.setAttribute('height',H);imgLayer.setAttribute('href',src);
    hasImg=true;bg.style.display='none';zoneG.style.display='none';resize();home();redraw()};im.src=src}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{setImage(r.result);idbSet(r.result);toast('Mapa cargado. Mueve los marcadores a su lugar.');closeSheet()};r.readAsDataURL(f)};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('leonida',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=rej})}
async function idbSet(v){try{const d=await idb();const tx=d.transaction('k','readwrite');v?tx.objectStore('k').put(v,'img'):tx.objectStore('k').delete('img')}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('img');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

addEventListener('resize',()=>{resize();redraw()});
resize();view.s=fit;view.x=(vw-W*fit)/2;view.y=(vh-H*fit)/2;chips();render();
idbGet().then(v=>{if(v)setImage(v)});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
